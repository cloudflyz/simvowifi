# simvowifi 配置示例 —— 复制到 data/config.yaml（simvowifi init 会自动生成）

line:
  name: ""            # 线路昵称，Bark 推送显示用（如 "移动主号"）
  pin: ""             # SIM 卡 PIN 码（启用 PIN 的卡必填；留空=无 PIN）
  imei: ""            # 15 位 IMEI。留空则 provision 时随机生成并回存
  msisdn: ""          # 本机号码（E.164，如 +8613800138000）。可选但建议填
  smsc: ""            # 短信中心。留空 = provision 时自动读卡（EF_SMSP）
  apn: "ims"
  idr_mode: "apn"     # apn（默认）| fqdn（严格 ePDG 用）
  cp_mode: "v4"       # v4（默认，3HK 必须 v4，IPv6 PDN 会 EAP FAILURE）| v6 | dual | auto
  epdg: ""            # ePDG 地址。空 = 按 IMSI 推导标准 3GPP FQDN；
                      # 3HK 不发布标准 DNS（解析得 127.0.0.1）→ 填 "wlan.three.com.hk"
  sec_encryption: false  # IMS 层 IPsec sec-agree。3HK 不建立 IMS IPsec（RTP 由隧道
                      # ESP 保护）→ false；需要 sec-agree 的运营商改 true
  use_reauth_id: true
  rekey_minutes: 30
  pani_country: ""    # ISO 国家码（如 CN）。留空按 MCC 自动

sip:
  transport: "udp"        # udp | tcp | tls —— Linphone iOS 建议 udp（局域网）或 tcp
  advertise_address: ""   # 对 SIP 客户端通告的地址。留空自动探测本机 IP
  ring_timeout: 35        # 去电振铃超时（秒）
  account:                # ← Linphone 里填的账号
    username: linphone
    password: "自动生成"   # init 时生成随机密码，请勿手改除非你知道在做什么

bark:
  server: "https://api.day.app"  # 自建 bark-server 改这里
  key: ""                # ← iOS Bark App 复制的 key（必填，否则收不到推送）
  group: "simvowifi"
  call_sound: "bell"     # 来电铃声，见 bark.day.app 声音列表
  call_level: "critical" # critical=绕过静音响铃（需在 Bark App 授权重要告警）
  include_body: true     # false=短信内容不进推送（隐私）
  # 推送加密（可选）：与 Bark App 首页『推送加密』设置一致；encrypt.key 留空=不加密
  # App 内选 AES128/CBC/PKCS7，密钥填同样的 16 位字符；IV 可任意 16 位（推送每条随机携带）
  encrypt:
    algorithm: "AES128"   # AES128/AES192/AES256
    mode: "CBC"           # CBC/ECB/GCM
    key: ""               # 16/24/32 位 ASCII，与 App 内一致
    iv: ""                # 留空=每条随机（推荐，随推送发送）
  events:                # 哪些事件推 Bark
    call_in: true
    sms_in: true
    tunnel_down: true
    tunnel_up: true
    registered: true

ami:
  user: simvowifi
  secret: "自动生成"
  port: 5038

webui:
  enable: true
  host: "0.0.0.0"     # 局域网可访问；仅本机用改 127.0.0.1
  port: 8080
  password: "自动生成"  # 浏览器登录密码（simvowifi web）

ports:
  sip_udp: 5060
  sip_tls: 5061
  ami: 5038
  rtp_start: 10000   # 与 docker-compose.yml 的 RTP 映射保持一致
  rtp_span: 60

debug:
  asterisk: true
